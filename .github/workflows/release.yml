name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install automake libtool boost libevent openssl sqlite zmq

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb-dev libdb++-dev libsqlite3-dev libzmq3-dev

      - name: Build
        run: |
          ./autogen.sh
          ./configure --disable-gui --disable-tests --disable-bench
          make -j2

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          case "${{ matrix.os }}" in
            macos-latest)
              tar -czf artifacts/twoore-macos-x86_64.tar.gz src/twoored src/twoore-cli src/twoore-miner
              ;;
            macos-14)
              tar -czf artifacts/twoore-macos-arm64.tar.gz src/twoored src/twoore-cli src/twoore-miner
              ;;
            ubuntu-latest)
              tar -czf artifacts/twoore-linux-x86_64.tar.gz src/twoored src/twoore-cli src/twoore-miner
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twoore-${{ matrix.os }}
          path: artifacts/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-pkg-config
            git

      - name: Build
        shell: msys2 {0}
        run: |
          ./autogen.sh
          ./configure --disable-gui --disable-tests --disable-bench --disable-wallet
          make -j2

      - name: Package artifacts
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          tar -czf artifacts/twoore-windows-x86_64.tar.gz src/twoored.exe src/twoore-cli.exe src/twoore-miner.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twoore-windows
          path: artifacts/
