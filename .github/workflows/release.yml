name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install automake libtool boost libevent openssl sqlite zmq

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb-dev libdb++-dev libsqlite3-dev libzmq3-dev

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          pacman --noconfirm -S base-devel mingw-w64-x86_64-toolchain automake libtool mingw-w64-x86_64-boost mingw-w64-x86_64-libevent mingw-w64-x86_64-openssl mingw-w64-x86_64-sqlite3 mingw-w64-x86_64-zeromq

      - name: Build
        run: |
          ./autogen.sh
          ./configure --disable-gui --disable-tests --disable-bench
          make -j2

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          case "${{ matrix.os }}" in
            macos-*)
              tar -czf artifacts/twoore-${{ matrix.os }}.tar.gz src/twoored src/twoore-cli src/twoore-miner
              ;;
            ubuntu-*)
              tar -czf artifacts/twoore-linux-x86_64.tar.gz src/twoored src/twoore-cli src/twoore-miner
              ;;
            windows-*)
              cp src/twoored.exe src/twoore-cli.exe src/twoore-miner.exe artifacts/
              7z a artifacts/twoore-windows-x86_64.zip artifacts/*.exe
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twoore-${{ matrix.os }}
          path: artifacts/
