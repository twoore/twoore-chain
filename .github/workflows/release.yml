name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create missing Makefile.am files
        run: |
          mkdir -p src/qt src/qt/test src/test
          touch src/qt/Makefile.am
          touch src/qt/test/Makefile.am
          touch src/test/Makefile.am

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install automake libtool boost libevent openssl sqlite zmq

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb-dev libdb++-dev libsqlite3-dev libzmq3-dev

      - name: Build
        run: |
          ./autogen.sh
          ./configure --disable-gui --disable-tests --disable-bench
          make -j2

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          case "${{ matrix.os }}" in
            macos-latest)
              tar -czf artifacts/twoore-macos-x86_64.tar.gz src/twoored src/twoore-cli src/twoore-miner
              ;;
            macos-14)
              tar -czf artifacts/twoore-macos-arm64.tar.gz src/twoored src/twoore-cli src/twoore-miner
              ;;
            ubuntu-latest)
              tar -czf artifacts/twoore-linux-x86_64.tar.gz src/twoored src/twoore-cli src/twoore-miner
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twoore-${{ matrix.os }}
          path: artifacts/
